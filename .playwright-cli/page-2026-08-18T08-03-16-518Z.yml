      - generic [ref=e3003]: מימוש ב-QuickSight — נבדק
      - heading "איך המסך הזה נבנה ב-QuickSight (ואיך בוחרים כמה מדדים יחד)" [level=3] [ref=e3004]
      - generic [ref=e3005]:
        - generic [ref=e3006]:
          - text: ויזואל אחד — Layer map ✓
          - paragraph [ref=e3007]: ויזואל מסוג Layer map יחיד. שכבה 1 = גבולות רשויות (GeoJSON) בצביעת gradient לפי המדד. אין צורך בשני ויזואלים.
        - generic [ref=e3008]:
          - text: המתקנים = שכבת GeoJSON שנייה ✓
          - paragraph [ref=e3009]: Layer map תומך בכמה שכבות. מוסיפים שכבה 2 של המתקנים כ-GeoJSON, צבע לפי מצב (תקין/לשיפוץ/לא פעיל) דרך שדה המפתח של השכבה.
        - generic [ref=e3010]:
          - text: הטריק (הכנה חד-פעמית)
          - paragraph [ref=e3011]: Layer map לא מקבל נקודות — לכן כל מתקן נשמר כפוליגון-עיגול זעיר (buffer ~90 מ׳). המרה חד-פעמית מנ״צ ל-GeoJSON, בלי שלבי BI מורכבים.
        - generic [ref=e3012]:
          - text: בורר המדד = Parameter control
          - paragraph [ref=e3013]: בורר הצבע = פרמטר + Calculated field שמחליף את המדד. מסננים (מחוז/סוג) = פקדי סינון רב-בחירה. שכבת המתקנים = toggle הצג/הסתר.
