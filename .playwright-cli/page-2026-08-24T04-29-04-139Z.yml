        - text: "ל-QuickSight אין סוג ויזואל Gantt מובנה, אבל ה- (מובנה, ללא עלות נוספת, נכתב כ-JSON) מכסה את כל מה שמופיע כאן. ה-JSON נכתב מול , ושדות מוזרקים בביטויי QuickSight (). הסדרה הראשונה היא האופסט מתחילת השנה ועד תחילת החלון, בצבע — , ולא הלבן-על-לבן שנדרש בוויזואל המובנה. הסדרה השנייה היא אורך החלון. הסדרה השלישית (scatter, סמל diamond) היא יהלום אישור המודל הסופי — . קו \"היום\" הוא , JSON רגיל. · (חלקי-חודש מ-1/1) · · — כולם , כי . אלה בדיוק הערכים ש- מחשב במוקאפ הזה. (ולכן אין formatters מותאמים — הכול קונפיגורציה סטטית) · · אין קישור לתמונות/GeoJSON · תקרה של 10,000 נקודות דאטה (25 מבחנים × 3 סדרות — לא קרוב). דרך , וכך גם תוויות שורה דו-שורתיות (גורם מקצועי + \"ממתין ל…\"). האם מודול נכלל בהתקנה. אם כן — הוא גאנט אמיתי ומייתר את סדרת האופסט ( לכל שורה). אם לא — הסכימה שלמעלה עובדת כמות שהיא ב-Highcharts Core; ההבדל קוסמטי בלבד. ואינו חלק מ-Core. ויזואלי Highcharts תומכים ב- וב- — לחיצה על שורה בגאנט יכולה לסנן את לוח הסטטוס שמתחתיו. (אם Highcharts לא זמין): Bar מוערם מובנה + אופסט בלבן + ל\"היום\" (נתמך בגרפי עמודות, קבוע או מחושב, עם תווית טקסט). המחיר: , ציר מספרי (0/30/60) במקום שמות חודשים, ותווית שורה בשורה אחת."
