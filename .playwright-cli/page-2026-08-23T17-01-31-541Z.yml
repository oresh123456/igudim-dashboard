      - generic [ref=e149]:
        - text: "המרחק מחושב ב-Calculated field ללא פונקציות טריגונומטריות (ל-QuickSight אין כאלה):"
        - code [ref=e150]: 111.32 * Sqrt( (lat-PinLat)² + (cos_lat*(lon-PinLon))² )
        - text: — cos_lat מחושב פעם אחת ב-ETL כעמודה לכל מתקן. הקירוב שגוי בפחות מ-1% למרחקים עד ~50 ק״מ. בורר העוגן = Parameter control מדאטהסט של נקודות עוגן (ערך "lat,lon" ⇒ Split + parseDecimal). הרדיוס בצעדים קבועים — כך ניתן לייצר מראש את עיגולי ה-GeoJSON ל-Layer Map; רדיוס רציף או נעיצה חופשית במפה ידרשו Custom visual content (iframe). המסנן הגלובלי של סוג מתקן חל כאן; מסנן המחוז לא — רדיוס חוצה מחוזות.
