[project]
name = "etl-drop-audit"
version = "0.1.0"
description = "Generic read-only Postgres ETL silent-drop auditor"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "sqlglot>=25",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
